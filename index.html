<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>IMC Digital Twin · นายายอาม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  #twin{position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;
    background:var(--bg);
    font-family:'Prompt','Sarabun',sans-serif;color:var(--tx);user-select:none}
  #twin canvas{display:block}
  .tw-pn{position:absolute;background:var(--pn);backdrop-filter:blur(10px);
    border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:13px}
  .tw-pn h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:600}
  #tw-title{top:14px;left:14px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px}
  #tw-logo{height:52px;width:auto;background:#fff;border-radius:10px;padding:3px 6px;box-shadow:0 0 14px rgba(255,255,255,.18)}
  #tw-title b{font-size:17px;font-weight:600;color:var(--hi);display:block}
  #tw-title span{font-size:11px;opacity:.6}
  #tw-kpi{top:92px;left:14px;display:grid;gap:8px;min-width:190px}
  .tw-k{display:flex;align-items:baseline;gap:8px}
  .tw-k i{font-style:normal;font-size:26px;font-weight:600;color:var(--hi);min-width:68px}
  .tw-k small{font-size:11px;opacity:.65;line-height:1.25}
  #tw-filter{top:14px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;max-width:52vw;justify-content:center}
  .tw-fl label{display:block;font-size:10px;letter-spacing:.1em;color:var(--ac);margin-bottom:4px}
  .tw-seg{display:inline-flex;border:1px solid rgba(90,200,255,.3);border-radius:10px;overflow:hidden}
  .tw-seg button,.tw-chip,#tw-ctl button{background:rgba(90,200,255,.08);color:var(--bt);border:0;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
  .tw-seg button.on,#tw-ctl button.on{background:#1fb5ff;color:#04101c;font-weight:600}
  .tw-chips{display:flex;flex-wrap:wrap;gap:5px;max-width:420px}
  .tw-chip{border-radius:999px;border:1px solid rgba(90,200,255,.25);padding:4px 10px}
  .tw-chip.on{background:var(--chon);color:var(--hi);border-color:var(--hi)}
  .tw-chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  #fmo{font-size:10px;opacity:.55;margin-top:3px}
  #tw-info{top:14px;right:14px;width:250px;max-height:calc(100% - 90px);overflow:auto}
  .tw-bar{height:5px;border-radius:3px;background:var(--bar);margin:3px 0 8px;overflow:hidden}
  .tw-bar div{height:100%}
  .tw-row{display:flex;justify-content:space-between;gap:6px}
  .tw-tk{cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px}
  .tw-tk:hover,.tw-tk.on{background:rgba(31,181,255,.18)}
  #tw-ctl{bottom:14px;right:14px;display:flex;gap:6px;padding:8px}
  #tw-ctl button{border:1px solid rgba(90,200,255,.3);border-radius:9px}
  #tw-leg{bottom:14px;left:14px;line-height:1.85;max-width:260px}
  .tw-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  #tw-tip{position:absolute;pointer-events:none;display:none;background:var(--tip);
    border:1px solid #1fb5ff;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.5;z-index:5}

  #tw-adm{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,8,16,.62);backdrop-filter:blur(4px)}
  #tw-adm.show{display:flex}
  #tw-adm .box{width:min(420px,calc(100vw - 28px));background:var(--box);border:1px solid rgba(90,200,255,.3);border-radius:16px;padding:18px;font-size:13px;user-select:text}
  #tw-adm h4{margin:0 0 12px;font-size:14px;color:var(--hi);letter-spacing:0;text-transform:none}
  #tw-adm input[type=password],#tw-adm input[type=url],#tw-adm input[type=text]{width:100%;box-sizing:border-box;background:var(--in);color:var(--tx);border:1px solid rgba(90,200,255,.3);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;margin:4px 0 10px}
  #tw-adm .btns{display:flex;flex-wrap:wrap;gap:6px}
  #tw-adm button{background:rgba(90,200,255,.1);color:var(--bt);border:1px solid rgba(90,200,255,.3);border-radius:9px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
  #tw-adm button.pri{background:#1fb5ff;color:#04101c;font-weight:600;border-color:#1fb5ff}
  #tw-adm small{display:block;opacity:.6;line-height:1.5;margin-top:8px}
  #adm-msg{min-height:18px;margin-top:8px;font-size:12px}
  #adm-msg.err{color:#ff6b7a}#adm-msg.ok{color:#34e0a1}
  #b-adm{opacity:.55}#b-adm:hover{opacity:1}
  #tw-cv{position:absolute;inset:0;touch-action:none}
  #tw-cv canvas{display:block}
  /* ===== มือถือ/แท็บเล็ต: แสดงทุกเมนู เรียงในหน้า เลื่อนดูได้ ===== */
  @media(max-width:1100px){
    #twin{height:auto;min-height:100vh;min-height:100dvh;overflow:visible;display:grid;gap:8px;padding:8px;box-sizing:border-box;
      grid-template-columns:1fr 1fr;grid-auto-rows:auto;align-content:start}
    #twin .tw-pn{position:relative;inset:auto;transform:none;width:auto;min-width:0;max-width:none;max-height:none;margin:0}
    #tw-cv{position:relative;inset:auto;height:56vh;min-height:320px;border-radius:14px;overflow:hidden}
    #twin.ui-off #tw-cv{height:78vh}
    #tw-title{grid-area:1/1}#tw-kpi{grid-area:1/2}#tw-filter{grid-area:2/1/3/3}#tw-cv{grid-area:3/1/4/3}
    #tw-info{grid-area:4/1;max-height:42vh;overflow:auto}#tw-leg{grid-area:4/2;max-width:none}#tw-ctl{grid-area:5/1/6/3;justify-content:center}
    #tw-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;min-width:0}
    #tw-kpi>h4{grid-column:1/-1;margin-bottom:2px}
    .tw-k{flex-direction:column;gap:0}.tw-k i{font-size:20px;min-width:0}.tw-k small{font-size:10px}
    #tw-filter{justify-content:flex-start}
    .tw-chips{max-width:none}
    #tw-adm{position:fixed}
  }
  @media(max-width:759px){
    #twin{grid-template-columns:1fr}
    #tw-title{grid-area:1/1}#tw-kpi{grid-area:2/1}#tw-filter{grid-area:3/1}#tw-cv{grid-area:4/1;height:52vh;min-height:300px}
    #tw-info{grid-area:5/1}#tw-leg{grid-area:6/1}#tw-ctl{grid-area:7/1}
    #tw-logo{height:40px}#tw-title b{font-size:15px}
    .tw-seg button,.tw-chip,#tw-ctl button{padding:7px 10px}
  }
#twin{--bg:radial-gradient(ellipse at 50% 40%,#0e2740 0%,#060d18 72%);--tx:#d6e6f5;--hi:#fff;--ac:#6fd3ff;--pn:rgba(8,20,36,.74);--bd:rgba(90,200,255,.22);--bt:#bfe8ff;--in:#0b1d33;--bar:rgba(255,255,255,.1);--cell:rgba(255,255,255,.07);--chon:rgba(255,255,255,.16);--tip:rgba(4,12,24,.92);--box:rgba(8,20,36,.96)}
#twin.light{--bg:radial-gradient(ellipse at 50% 40%,#fff 0%,#d9e7f3 72%);--tx:#1d3347;--hi:#0a2540;--ac:#0b78b8;--pn:rgba(255,255,255,.84);--bd:rgba(20,110,170,.3);--bt:#0b4a75;--in:#fff;--bar:rgba(10,37,64,.12);--cell:rgba(10,37,64,.07);--chon:rgba(10,37,64,.14);--tip:rgba(255,255,255,.96);--box:rgba(255,255,255,.97)}
.tw-pn>h4{cursor:pointer}.tw-pn>h4::after{content:'\25BE';float:right;opacity:.6;margin-left:10px}.tw-pn.min>h4::after{content:'\25B8'}
.tw-pn.min>*:not(h4){display:none!important}.tw-pn.min{padding-bottom:8px}.tw-pn.min>h4{margin:0}
#tw-filter>h4{flex:0 0 100%;margin:0 0 -2px}
#twin.ui-off .tw-pn:not(#tw-ctl){display:none!important}
#tw-ctl{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}
#tw-sync{display:block;font-size:10px;opacity:.55;margin-top:2px}
</style>
</head>

  (function loop() {

    halo.scale.setScalar(1 + Math.sin(t * 2) * .03); beam.material.opacity = .25 + Math.sin(t * 3) * .1;
    rings.forEach(r => { const s = (t * .9 + r.userData.ph * .3) % 1; r.visible = showOD && r.userData.m.visible; r.scale.setScalar(1 + s * 1.8); r.material.opacity = 1 - s; });
    walkers.forEach(w => { const u = w.userData, q = (t * 1.0 / u.seg + u.off) % 2, out = q < 1, f = out ? q : 2 - q, d = .9 + f * u.seg,
      ca = Math.cos(u.a), sa = Math.sin(u.a), ln = out ? .15 : -.15, sg = out ? 1 : -1, ph = t * 9 + u.off * 5;
      w.position.set(u.hx + ca * d - sa * ln, .37 + Math.abs(Math.sin(ph)) * .03, u.hz + sa * d + ca * ln); w.rotation.y = Math.atan2(ca * sg, sa * sg);
      const sw = Math.sin(ph) * .6; u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw; });
    if (focus) { ctl.target.lerp(focus.t, .07); cam.position.lerp(focus.p, .07); if (cam.position.distanceTo(focus.p) < .05) focus = null; }
    ctl.update(); rd.render(scene, cam);
  })();

  /* ---------- Public API + ข้อมูลตัวอย่าง ---------- */
  function setData(data, showNames) {
    if (!data || data.length < 2) return;
    const sg = data.length + ':' + JSON.stringify(data) + (showNames ? 1 : 0), nw = new Date(), tm = String(nw.getHours()).padStart(2, '0') + ':' + String(nw.getMinutes()).padStart(2, '0');
    const stamp = () => { const nt = ALL.filter(p => !p.t).length; $('tw-sync').textContent = 'อัปเดต ' + tm + ' · ข้อมูล ' + ALL.length + ' ราย' + (nt ? ' · นอกพื้นที่ ' + nt : ''); };
    if (sg === window.__twSig) { stamp(); return; } window.__twSig = sg;
    ALL = analyze(data, !!showNames); stamp();
    DZL = dzCounts(ALL).map(x => x[0]); DZC = {}; DZL.forEach((k, i) => DZC[k] = PAL[i % PAL.length]);
    const fys = [...new Set(ALL.map(p => p.fy).filter(Boolean))].sort((a, b) => b - a);
    FYS = fys; [...ST.fys].forEach(f => { if (!fys.includes(f)) ST.fys.delete(f); });
    selT = null; selP = null; build();
  }
  window.DigitalTwin = {
    update: setData, onOpen: null,
    openPatient(p) {
      if (this.onOpen) return this.onOpen(p);
      if (typeof showTab === 'function' && document.getElementById('nav-list')) {
        showTab('list', document.getElementById('nav-list')); const q = document.getElementById('tableSearch');
        if (q) { q.value = p.name || p.id; typeof applyTableFilters === 'function' && applyTableFilters(); q.scrollIntoView({block: 'center'}); }
      } else alert('ผู้ป่วย: ' + (p.name || 'ID ' + p.id));
    }
  };
  function demo() {
    let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, dg = ['Strokeตีบ', 'Strokeแตก', 'TBI', 'Fx.Hip', 'SCI'], W = [.34, .22, .16, .2, .08], rows = [['ID']];
    for (let i = 1; i <= 150; i++) {
      const days = Math.floor(rnd() * 760), d = new Date(Date.now() - days * 864e5), iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      let x = rnd(), di = 0; while (di < 4 && x > W[di]) { x -= W[di]; di++; }
      let bi = Math.floor(rnd() * 14); const r = [i, 'ผู้ป่วย ' + i, '', 60, dg[di], NAMES[Math.floor(Math.pow(rnd(), 1.3) * 6)], iso, bi], done = Math.min(6, Math.floor(days / 30));
      for (let k = 1; k <= 6; k++) { if (k <= done && rnd() > .2) { bi = Math.min(20, bi + Math.floor(rnd() * 4)); r.push(bi); } else r.push(''); }
      const y = rnd(); if (y < .04) r[9] = 'เสียชีวิต'; else if (y < .09) r[10] = 'ย้าย'; else if (y < .14) r[9] = 'Recurrent';
      r.push(rnd() > .6 ? '/' : '-', '-', 0, ''); rows.push(r);
    }
    return rows;
  }

  /* ---------- ผู้ดูแลระบบ: ตั้ง Web App URL หลังรหัสผ่าน ---------- */
  (function () {
    const SALT = 'imc-twin-v1:', PW_HASH = '3e94d68f4cee66dc52d1e54a345155281574f46fea49e5dfd977fb149563cffc', KEY = 'imc_twin_url', DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbx7AFbdzRWnD3L_za41DncO-cBbwfGo0XhVxzkbxJ-d26_d0-EYN0OtKq5NoP30vDrooA/exec';  /* ใส่ URL ตรงนี้ได้ถ้าต้องการฝังในไฟล์ให้ทุกเครื่องใช้ร่วมกัน */
    const g = id => document.getElementById(id);
    let unlocked = false, rows = null;
    const store = {get() { try { return localStorage.getItem(KEY) || DEFAULT_URL; } catch (e) { return DEFAULT_URL; } },
      set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }};
    try { const q = new URLSearchParams(location.search).get('app');
      if (q && /^https:\/\/script\.google(usercontent)?\.com\//.test(q)) { store.set(q); history.replaceState(null, '', location.pathname + location.hash); } } catch (e) {}
    async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    function msg(t, k) { const m = g('adm-msg'); m.textContent = t; m.className = k || ''; }
    function show(on) { g('tw-adm').classList.toggle('show', on); if (on) { g('adm-lock').style.display = unlocked ? 'none' : ''; g('adm-panel').style.display = unlocked ? '' : 'none'; g('adm-url').value = store.get(); msg(''); if (!unlocked) { g('adm-pw').value = ''; setTimeout(() => g('adm-pw').focus(), 30); } } }
    async function load() {
      const u = store.get(); if (!u) return false;
      try {
        const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'action=getTwinData', {redirect: 'follow'});
        let d = await r.json(); if (d && !Array.isArray(d)) d = d.data || d.rows;
        if (!Array.isArray(d) || d.length < 2) throw new Error('รูปแบบข้อมูลไม่ถูกต้อง');
        rows = d; DigitalTwin.update(rows, unlocked); return true;
      } catch (e) { console.warn('IMC twin load', e); throw e; }
    }
    g('b-adm').onclick = () => show(true);
    g('adm-x1').onclick = g('adm-x2').onclick = () => show(false);
    g('tw-adm').addEventListener('mousedown', e => { if (e.target === g('tw-adm')) show(false); });
    async function login() {
      if (!(window.crypto && crypto.subtle)) { alert('ต้องเปิดผ่าน https เพื่อตรวจรหัสผ่าน'); return; }
      if (await sha(SALT + g('adm-pw').value.trim()) === PW_HASH) { unlocked = true; show(true); if (rows) DigitalTwin.update(rows, true); }
      else { g('adm-pw').value = ''; g('adm-pw').placeholder = 'รหัสไม่ถูกต้อง'; }
    }
    g('adm-in').onclick = login; g('adm-pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    g('adm-save').onclick = async () => {
      const u = g('adm-url').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { msg('URL ต้องขึ้นต้นด้วย https://script.google.com/', 'err'); return; }
      store.set(u); msg('กำลังโหลด…');
      try { await load(); msg('โหลดข้อมูลสำเร็จ ' + (rows.length - 1) + ' แถว', 'ok'); } catch (e) { msg('เชื่อมต่อไม่ได้: ' + e.message + ' (ตรวจว่า Deploy เป็น Anyone และมี doGet)', 'err'); }
    };
    g('adm-share').onclick = async () => {
      const u = store.get(); if (!u) { msg('ยังไม่ได้ตั้ง URL', 'err'); return; }
      const link = location.href.split(/[?#]/)[0] + '?app=' + encodeURIComponent(u);
      try { await navigator.clipboard.writeText(link); msg('คัดลอกลิงก์แล้ว เปิดลิงก์นี้บนเครื่องอื่นครั้งเดียว เครื่องนั้นจะจำ URL ให้', 'ok'); } catch (e) { prompt('คัดลอกลิงก์นี้', link); }
    };
    g('adm-clear').onclick = () => { store.set(''); g('adm-url').value = ''; msg('ลบ URL แล้ว', 'ok'); };
    g('adm-out').onclick = () => { unlocked = false; if (rows) DigitalTwin.update(rows, false); show(false); };
    window.__twAutoLoad = () => store.get() ? (load().catch(() => {}), true) : false;
  })();
  /* ---------- เมนูหุบได้ / ธีม / รีเฟรช ---------- */
  root.addEventListener('click', e => { const h = e.target.closest('.tw-pn > h4'); if (h && !e.target.closest('[data-close]')) h.parentElement.classList.toggle('min'); });
  $('b-th').onclick = () => setTheme(!LIGHT);
  $('b-ui').onclick = function () { this.classList.toggle('on'); const off = this.classList.contains('on'); root.classList.toggle('ui-off', off); this.textContent = off ? '👁 แสดงเมนู' : '👁 ซ่อนเมนู'; };
  const GAS = typeof google !== 'undefined' && google.script && google.script.run;
  function pull() {
    if (GAS) google.script.run.withSuccessHandler(d => { if (Array.isArray(d) && d.length > 1) DigitalTwin.update(d, false); else $('tw-sync').textContent = 'ไม่พบข้อมูล'; })
      .withFailureHandler(() => { $('tw-sync').textContent = 'โหลดข้อมูลไม่สำเร็จ'; }).getTwinData();
    else window.__twAutoLoad();
  }
  $('b-rf').onclick = pull; if (GAS) $('b-adm').style.display = 'none';
  document.fonts.ready.then(() => { if (GAS) pull(); else if (!window.__twAutoLoad()) DigitalTwin.update(demo(), false); setInterval(pull, 300000); });
})();
